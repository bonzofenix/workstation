# Vim-style navigation
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Shell and terminal settings
set -g default-shell /bin/zsh
set -g default-terminal "xterm-ghostty"
set -ga update-environment "TMUX_BAR_COLOR"

# Mouse and history
set -g mouse on
set -g history-limit 500000

# Window/pane behavior
bind-key C-b last-window
set -g base-index 1
set -s escape-time 0
set-option -g allow-passthrough on

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Tab/window naming
set -g allow-rename off
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Status bar styling. The color says which account the session belongs to, so a
# root shell is obvious at a glance: test is green, root is red, anyone else
# keeps the original violet. TMUX_BAR_COLOR overrides the username default.
#
# id -un rather than $USER: $USER is inherited and still reads as the login name
# under `sudo -s`, which would paint a root shell violet — the exact case this
# is meant to catch. Both settings are computed in one run-shell so a new
# username only has to be added in one place.
#
# Scope: run-shell evaluates once when the config is sourced, and the settings
# are server-global, so this reflects the user who started the tmux server. A
# `sudo -s` inside an existing pane does not repaint the bar.
#
# The pomodoro/chess-clock widget used to live in status-right; removed so
# the window list has the full bar width to itself — with several tabs open
# on a phone-width terminal, the clock pushed tabs off-screen.
run-shell 'c="${TMUX_BAR_COLOR:-$(case "$(id -un)" in test) echo colour46;; root) echo colour196;; *) echo colour135;; esac)}"; tmux set -g status-bg "$c"; tmux setw -g window-status-current-style "fg=$c,bg=black"'
setw -g aggressive-resize on
setw -g window-status-separator " | "

# Clear peon-ping alert styling when switching to a window with @claude_alert.
# @claude_original_name is only set when peon-ping is configured to rename the
# window (tmux_rename_window), so the name is restored only if it was stored.
set-hook -g session-window-changed 'run-shell "~/workstation/bin/tmux-clear-claude-alert #{window_id}"'

# Plugins (install tpm first: https://github.com/tmux-plugins/tpm)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
