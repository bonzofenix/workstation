# Vim-style navigation
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Shell and terminal settings
set -g default-shell /bin/zsh
set -g default-terminal "xterm-ghostty"
set -ga update-environment "TMUX_BAR_COLOR"

# Mouse and history
set -g mouse on
set -g history-limit 500000

# Window/pane behavior
bind-key C-b last-window
set -g base-index 1
set -s escape-time 0
set-option -g allow-passthrough on

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Tab/window naming
set -g allow-rename off
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Status bar styling. The color says which account the session belongs to, so a
# root shell is obvious at a glance: test is green, root is red, anyone else
# keeps the original violet. TMUX_BAR_COLOR overrides the username default.
#
# id -un rather than $USER: $USER is inherited and still reads as the login name
# under `sudo -s`, which would paint a root shell violet — the exact case this
# is meant to catch. Both settings are computed in one run-shell so a new
# username only has to be added in one place.
#
# Scope: run-shell evaluates once when the config is sourced, and the settings
# are server-global, so this reflects the user who started the tmux server. A
# `sudo -s` inside an existing pane does not repaint the bar.
#
# run-shell uses /bin/sh, which on macOS is bash 3.2 by default. bash 3.2's
# parser closes $(...) at the first unbalanced `)`, so the case patterns use
# the POSIX `(pattern)` form; a bare `test)` there produced a garbage colour
# that tmux rejected, with no visible error.
#
# status-style, not status-bg: status-bg is deprecated and, since tmux 3.2,
# only overrides status-style at draw time, so `show -g status-style` keeps
# reporting the old value. The -gu clears a status-bg left by an older version
# of this line, which would otherwise shadow status-style until a restart.
#
# Yellow is a sentinel. At server start run-shell discards its output and exit
# status, so a failed colour computation (bad TMUX_BAR_COLOR, tmux not on
# PATH) would otherwise leave tmux's default green, which reads as the test
# account. A yellow bar means the computation failed; `prefix ~` shows why.
#
# The pomodoro/chess-clock widget used to live in status-right; removed so
# the window list has the full bar width to itself — with several tabs open
# on a phone-width terminal, the clock pushed tabs off-screen.
set -gu status-bg
set -g status-style "bg=colour226,fg=black"
run-shell 'c="${TMUX_BAR_COLOR:-$(case "$(id -un)" in (test) echo colour46;; (root) echo colour196;; (*) echo colour135;; esac)}"; tmux set -g status-style "bg=$c,fg=black" && tmux setw -g window-status-current-style "fg=$c,bg=black"'
setw -g aggressive-resize on
setw -g window-status-separator " | "

# Clear peon-ping alert styling when switching to a window with @claude_alert.
# @claude_original_name is only set when peon-ping is configured to rename the
# window (tmux_rename_window), so the name is restored only if it was stored.
set-hook -g session-window-changed 'run-shell "~/workstation/bin/tmux-clear-claude-alert #{window_id}"'

# Pass bells on to the terminal. peon-ping rings the bell when a Claude session
# finishes or needs input, and every tmux in the chain (the Mac's, then the one
# on the far end of ssh) must forward it for Ghostty to play the sound. All
# three are tmux defaults, set here so the alert does not depend on them.
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# On the Mac, play the sound from tmux. Ghostty 1.3.1 marks the tab with 🔔
# but its bell-features audio stays silent, and afplay does not depend on the
# terminal. Bells from remote hosts reach this tmux through the ssh pane, so
# they sound here too. Hosts without afplay skip this.
if-shell 'command -v afplay >/dev/null' {
  set-hook -g alert-bell 'run-shell -b "afplay -v 0.5 /System/Library/Sounds/Glass.aiff"'
}

# Ctrl+Shift+R (Ghostty sends it as M-R): search every Claude conversation,
# running or finished, and jump to or resume the one picked. -EE keeps the
# popup open when claude-search fails so its error stays readable.
bind-key -n M-R display-popup -EE -w 90% -h 85% "~/workstation/bin/claude-search --popup"

# Survive reboots: continuum saves every 5 minutes and restores when the tmux
# server starts. Panes that were running claude reopen the same conversation
# through bin/claude-tmux-session (or its picker when the pane was never
# tagged). The match is a regex on the pane's full command: claude as the first
# word, bare or followed by a flag, so neither a claude path in another
# program's arguments (nvim ~/.claude/...) nor a subcommand (claude agents,
# claude attach) counts. resurrect expands this string with `eval`, so never
# put a $ right before -> ($- is the shell's option flags).
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-hook-post-save-layout '~/workstation/bin/claude-tmux-session save'
set -g @resurrect-processes '"~^([^ ]*/)?claude($| +-)->~/workstation/bin/claude-tmux-session resume"'

# Plugins (install tpm first: https://github.com/tmux-plugins/tpm)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# continuum hooks status-right to autosave, so it goes last.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
